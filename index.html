<body>

      <ellipse cx="31" cy="355" rx="18" ry="10" transform="rotate(-32 31 355)"/><ellipse cx="38" cy="400" rx="18" ry="10" transform="rotate(38 38 400)"/>

    <g class="frames">

      <path d="M74 200 C63 183 60 162 74 153 C87 163 85 184 74 200"/>

    <text x="228" y="124" transform="rotate(7 228 124)">livros</text><text x="228" y="146" transform="rotate(7 228 146)">café</text>
    <text x="228" y="168" transform="rotate(7 228 168)">música</text><text x="228" y="190" transform="rotate(7 228 190)">amigas ♡</text>
  </svg>
  <svg class="right-decor" viewBox="0 0 330 520" aria-hidden="true">
    <g class="books">
      <rect x="90" y="50" width="210" height="58" rx="6"/><rect x="76" y="104" width="220" height="56" rx="6"/>
      <rect x="94" y="156" width="205" height="58" rx="6"/><path class="book-spines" d="M125 54v50 M125 108v48 M125 160v50"/>
      <text x="190" y="84">Jane Austen</text><text x="190" y="138">F. Cole ridge</text><text x="190" y="190">Clarice Lispector</text>
    </g>
    <ellipse class="cup-shadow" cx="220" cy="238" rx="70" ry="15"/>
    <path class="saucer" d="M145 220h150c0 20-34 28-75 28s-75-8-75-28z"/>
    <path class="coffee-cup" d="M176 177h94l-9 50H185z"/><ellipse cx="223" cy="177" rx="47" ry="12"/>
    <path class="heart" d="M222 198c-14-13-29 6 0 19 29-13 14-32 0-19z"/>
    <path class="handle" d="M269 188c28 0 29 29 4 31"/>
    <g class="open-book">
      <ellipse class="book-shadow" cx="150" cy="390" rx="111" ry="14"/>
      <path class="book-cover" d="M38 280c43-16 82-9 111 22 29-31 68-38 111-22l-7 105c-38-16-76-9-104 15-28-24-66-31-104-15z"/>
      <path class="book-page left-page" d="M45 272c42-14 79-5 104 23v90c-27-25-64-34-104-18z"/>
      <path class="book-page right-page" d="M149 295c25-28 62-37 104-23v95c-40-16-77-7-104 18z"/>
      <path class="book-lines" d="M64 293c24-5 48 2 65 15M64 315c24-5 48 2 65 15M64 337c24-5 48 2 65 15M169 308c17-13 41-20 65-15M169 330c17-13 41-20 65-15M169 352c17-13 41-20 65-15"/>

    <g class="flowers">
      <path d="M242 430 C260 376 242 350 270 312 M270 430 C291 382 284 355 308 326"/>
      <circle cx="270" cy="313" r="8"/><circle cx="308" cy="325" r="8"/><circle cx="251" cy="355" r="7"/><circle cx="290" cy="367" r="7"/>
    </g>

    <text class="quote" x="82" y="442" transform="rotate(-8 82 442)">grandes histórias.”</text>
  </svg>

  <header class="brand">
    <svg class="brand-cup" viewBox="0 0 130 90" aria-hidden="true">
      <path class="steam" d="M48 25c-12-13 12-16 0-29M67 23C55 10 79 7 67-6M86 25C74 12 98 9 86-4"/>
      <ellipse class="cup-rim" cx="65" cy="32" rx="42" ry="11"/>
      <path class="cup-body" d="M24 32c2 35 15 48 41 48s39-13 41-48H24z"/>
      <path class="cup-shade" d="M24 32c5 29 16 43 41 48 3 0 5 0 8-1-19-3-32-17-36-47H24z"/>
      <path class="cup-heart" d="M65 63c-13-9-17 7 0 15 17-8 13-24 0-15z"/>
      <path class="cup-handle" d="M105 39c26-3 29 31 3 33"/>
      <ellipse class="cup-saucer" cx="65" cy="84" rx="48" ry="8"/>
    </svg>
    <h1>Café &amp; charme</h1>
    <div class="brand-line"></div>
    <p>BOA COMIDA · BONS LIVROS · GRANDES MOMENTOS</p>
  </header>

  <main class="content">
    <aside class="cart-panel">
      <h2><span class="cart-symbol">🛒</span> Seu pedido</h2>
      <ul id="listaPedido"></ul>
      <div class="total"><span>Total</span><strong id="totalPedido">R$ 0,00</strong></div>
      <button class="brown-button checkout" type="button">Finalizar pedido <span>→</span></button>
    </aside>

    <section class="order-panel">
      <form id="formPedido">
        <div class="categories">
          <button class="category active" data-category="doces" type="button">Doces</button>
          <button class="category" data-category="bebidas" type="button">Bebidas</button>
          <button class="category" data-category="salgados" type="button">Salgados</button>
        </div>

        <div class="cardapio-row">
          <strong>Veja nosso cardápio:</strong>
          <a href="cardapio.html" class="cardapio-button">Cardápio</a>
        </div>

        <label class="field"><span>Item:</span><select id="item-select"><option value="">Selecione uma opção</option></select></label>
        <label class="field"><span>Deseja algum acompanhamento?</span><select id="acompanhamento"><option value="0">Sem acompanhamento</option><option value="1">Canela</option><option value="2">Chantilly</option><option value="3">Leite</option><option value="4">Chocolate</option></select></label>
        <label class="details-field"><span>Detalhes:</span><textarea id="detalhes" placeholder="Especifique seu pedido..."></textarea></label>

        <fieldset>
          <legend>Formas de pagamento:</legend>
          <label><input type="radio" name="pagamento" checked> Pix</label>
          <label><input type="radio" name="pagamento"> Cartão de crédito</label>
          <label><input type="radio" name="pagamento"> Cartão de débito</label>
          <label><input type="radio" name="pagamento"> Dinheiro</label>
        </fieldset>
        <button class="brown-button add-button" type="submit">Adicionar +</button>
      </form>
    </section>
  </main>

  <footer><span></span><span>✦</span><p>Desenvolvido por <strong>@laramcbx</strong> · <strong>@caio</strong> · <strong>@yas</strong> · <strong>@zyxx_gi</strong> <p> <span>✦</span> </footer>
</div>

<script>
const catalog = {
  doces: [['Bolo', 10], ['Rolinho', 6], ['Tortilete', 7], ['Madeleine', 6], ['Macaron', 6.5], ['Pudim', 8]],
  bebidas: [['Matcha', 12], ['Suco', 8], ['Achocolatado', 7], ['Café', 4], ['Café gelado', 5], ['Capuccino', 8], ['Latte', 10]],
  salgados: [['Crepe', 15], ['Focaccia', 18], ['Bruschetta', 16], ['Diplomata', 12], ['Pão', 4], ['Croissant', 8]]
};
const icons = { doces: '🧁', bebidas: '☕', salgados: '🥐' };
let items = [];
let total = 0;
const list = document.querySelector('#listaPedido');
const select = document.querySelector('#item-select');
const details = document.querySelector('#detalhes');
const accompaniment = document.querySelector('#acompanhamento');
const totalEl = document.querySelector('#totalPedido');

function money(value) {
  return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function fillSelect(category) {
  select.innerHTML = '<option value="">Selecione uma opção</option>';
  catalog[category].forEach(([name, price]) => {
    select.add(new Option(name, price));
  });
}
function render() {
  list.innerHTML = '';
  if (!items.length) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = 'Seu carrinho está vazio';
    list.append(empty);
  } else {
    items.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="item-icon">${icons[item.category]}</span><div><strong>${item.name}</strong>${item.details ? `<small>${item.details}</small>` : ''}</div><b>${money(item.price)}</b><button class="remove" data-index="${index}" aria-label="Remover">🗑</button>`;
      list.append(li);
    });
  }
  totalEl.textContent = money(total);
}

fillSelect('doces');
render();

document.querySelectorAll('.category').forEach(button => button.addEventListener('click', () => {
  document.querySelector('.category.active').classList.remove('active');
  button.classList.add('active');
  fillSelect(button.dataset.category);
}));

document.querySelector('#formPedido').addEventListener('submit', event => {
  event.preventDefault();
  if (!select.value) return select.focus();
  const category = document.querySelector('.category.active').dataset.category;
  const name = select.options[select.selectedIndex].text;
  const price = Number(select.value) + Number(accompaniment.value);
  items.push({ category, name, price, details: details.value.trim() });
  total += price;
  details.value = '';
  accompaniment.value = '0';
  select.value = '';
  render();
});

list.addEventListener('click', event => {
  const remove = event.target.closest('.remove');
  if (!remove) return;
  total -= items[Number(remove.dataset.index)].price;
  items.splice(Number(remove.dataset.index), 1);
  render();
});
</script>
</body>
</html>
